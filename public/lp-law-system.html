<style>
  html, body { font-family: 'Rubik', sans-serif; background: #f8f9fd; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }

  /* Tasteful scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d9dade; border-radius: 9999px; border: 3px solid #f8f9fd; }
  ::-webkit-scrollbar-thumb:hover { background: #c5c5d7; }

  /* Smooth view transitions — no jumps */
  .view { animation: viewIn .42s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .stagger > * { animation: viewIn .5s cubic-bezier(.22,.61,.36,1) both; }
  .stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.06s}
  .stagger > *:nth-child(3){animation-delay:.10s}.stagger > *:nth-child(4){animation-delay:.14s}
  .stagger > *:nth-child(5){animation-delay:.18s}.stagger > *:nth-child(6){animation-delay:.22s}

  /* Animated bars */
  .bar-fill { width: 0; transition: width 1.1s cubic-bezier(.22,.61,.36,1); }

  /* Nav active */
  .nav-item { transition: background .18s ease, color .18s ease; }
  .nav-item .nav-ind { transition: opacity .2s ease, transform .2s ease; opacity: 0; transform: scaleY(.4); }
  .nav-item.active { color: #384bd5; font-weight: 700; background: #f2f3f7; }
  .nav-item.active .nav-ind { opacity: 1; transform: scaleY(1); }

  /* Cards lift */
  .lift { transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
  .lift:hover { box-shadow: 0 12px 30px -10px rgba(26,26,46,.18); transform: translateY(-2px); }

  /* Kanban drag */
  .kcard { transition: box-shadow .18s ease, transform .18s ease, opacity .18s ease; cursor: grab; }
  .kcard:hover { box-shadow: 0 12px 26px -12px rgba(26,26,46,.22); transform: translateY(-2px); }
  .kcard.dragging { opacity: .45; cursor: grabbing; }
  .kcol.drop-on { background: #eef0ff; outline: 2px dashed #bcc2ff; outline-offset: -6px; }

  /* Toggle switch */
  .sw { width: 42px; height: 24px; border-radius: 9999px; background: #c5c5d7; position: relative; transition: background .2s ease; flex: 0 0 auto; }
  .sw::after { content:""; position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition: transform .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .sw.on { background: #384bd5; }
  .sw.on::after { transform: translateX(-18px); }

  .row-link { transition: background .15s ease; }
  .row-link:hover { background: #f2f3f7; }
  .fade-soft { animation: viewIn .3s ease both; }
  [hidden] { display: none !important; }
</style>

function h3(t){ return '<h3 class="text-lg font-semibold text-on-surface mb-4">'+esc(t)+'</h3>'; }

  var m={'פעיל':'bg-[#D1FAE5] text-[#065F46]','דחוף':'bg-[#FEE2E2] text-[#991B1B]','בטיפול':'bg-[#FEF3C7] text-[#92400E]','ממתין':'bg-surface-container-high text-on-surface-variant','סגור':'bg-surface-container-high text-on-surface-variant'};
  return '<span class="px-2.5 py-1 rounded-full text-xs font-semibold '+(m[s]||m['בטיפול'])+'">'+esc(s)+'</span>';
}
function icon(n, cls){ return '<span class="material-symbols-outlined '+(cls||'')+'">'+n+'</span>'; }

V.pipeline = function(){
  var cols = STAGES.slice(0,5).reverse(); // show working stages RTL (first = פנייה חדשה on the right)
  // Actually keep canonical order right→left: פנייה חדשה ... תיק פעיל
  cols = ['פנייה חדשה','נקבעה פגישת ייעוץ','ממתין למסמכים','נשלחה הצעת שכר טרחה','תיק פעיל'];
  var colHtml = cols.map(function(stage){
    var items = LEADS.filter(function(l){return l.stage===stage;});
    var cards = items.map(function(l){ return kanbanCard(l); }).join('') || '<div class="text-xs text-on-surface-variant text-center py-8 opacity-60">— אין פניות —</div>';
    var dotc = stage==='פנייה חדשה'?'bg-primary':(stage==='נקבעה פגישת ייעוץ'?'bg-[#F59E0B]':'bg-outline');
    return '<div class="kcol w-[300px] flex-shrink-0 rounded-2xl transition-colors" data-stage="'+esc(stage)+'">'+
      '<div class="flex items-center justify-between mb-3 px-1"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full '+dotc+'"></span><h3 class="font-semibold text-on-surface">'+esc(stage)+'</h3></div>'+
      '<span class="text-xs bg-surface-container-high text-on-surface-variant rounded-full w-6 h-6 flex items-center justify-center font-bold cnt">'+items.length+'</span></div>'+
      '<div class="kbody space-y-3 min-h-[120px] p-1">'+cards+'</div></div>';
  }).join('');
  return '<div class="view"><div class="mb-6"><h2 class="text-2xl font-bold">צנרת לידים</h2><p class="text-on-surface-variant text-sm mt-1">ניהול ומעקב אחר פניות פתוחות ותהליכי מכירה. גררו כרטיס בין שלבים כדי לעדכן.</p></div>'+
    '<div class="flex gap-4 overflow-x-auto pb-4">'+colHtml+'</div></div>';
};
function kanbanCard(l){
  var accent = l.stage==='פנייה חדשה'?'border-r-4 border-primary':(l.stage==='נקבעה פגישת ייעוץ'?'border-r-4 border-[#F59E0B]':(l.warn?'border-r-4 border-[#F59E0B]':'border-r-4 border-outline-variant'));
  var bottom = l.warn ? '<span class="text-[#B45309] font-medium flex items-center gap-1">'+icon('warning','text-[14px]')+' '+l.days+' ימים בשלב</span>' :
    '<span class="text-on-surface-variant flex items-center gap-1">'+icon('schedule','text-[14px]')+' '+l.days+' ימים בשלב</span>';
  var mid = (l.stage==='נקבעה פגישת ייעוץ') ?
    '<div class="bg-surface-container-low rounded-lg px-3 py-2 my-2 text-sm flex items-center gap-2">'+icon('event','text-[16px] text-primary')+' '+esc(l.when)+'</div>' :
    '<p class="text-sm text-on-surface-variant my-2 leading-relaxed line-clamp-2">'+esc(l.note||'')+'</p>';
  return '<div class="kcard bg-surface-container-lowest rounded-xl border border-outline-variant '+accent+' p-4 shadow-sm" draggable="true" data-name="'+esc(l.name)+'">'+
    '<div class="flex items-start justify-between"><div class="flex items-center gap-2">'+avatar(l.init,l.type,9)+
    '<div><p class="font-bold text-on-surface text-sm">'+esc(l.name)+'</p>'+typeChip(l.type)+'</div></div>'+
    '<button class="text-outline hover:text-on-surface">'+icon('more_vert','text-[18px]')+'</button></div>'+
    mid+
    '<div class="flex items-center justify-between text-xs pt-2 border-t border-outline-variant"><span class="text-primary font-bold">₪'+esc(l.value)+'</span>'+bottom+'</div></div>';
}

V.tasks = function(){

      '<div class="w-2 h-2 rounded-full '+dot+' flex-shrink-0"></div>'+
      '<p class="flex-1 '+(t.done?'line-through text-on-surface-variant':'text-on-surface')+'">'+esc(t.t)+'</p>'+

  }).join('');

function docRows(cat){
  var list = DOCS.filter(function(d){ return cat==='all' || d.cat===cat; });
  if(!list.length) return '<tr><td colspan="5" class="py-10 text-center text-on-surface-variant">אין מסמכים בקטגוריה זו</td></tr>';
  var srcChip = {'וואטסאפ':'bg-[#D1FAE5] text-[#065F46]','מייל':'bg-[#DBEAFE] text-[#1E40AF]','מערכת':'bg-surface-container-high text-on-surface-variant'};
  return list.map(function(d){
    return '<tr class="row-link border-b border-outline-variant fade-soft">'+
      '<td class="py-3 px-4"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-error-container text-on-error-container flex items-center justify-center flex-shrink-0">'+icon('description','text-[18px]')+'</div><div><p class="font-medium text-sm">'+esc(d.name)+'</p><p class="text-xs text-on-surface-variant">'+esc(d.sub)+'</p></div></div></td>'+
      '<td class="py-3 px-4 text-sm">'+esc(d.client)+'</td>'+
      '<td class="py-3 px-4">'+typeChip(d.cat)+'</td>'+
      '<td class="py-3 px-4"><span class="text-xs font-medium px-2 py-1 rounded-full '+(srcChip[d.src]||srcChip['מערכת'])+'">'+esc(d.src)+'</span></td>'+
      '<td class="py-3 px-4 text-sm text-on-surface-variant">'+esc(d.date)+'</td></tr>';
  }).join('');
}

V.calendar = function(){
  var dows=['א','ב','ג','ד','ה','ו','ש'];
  // June 2026 starts on Monday (1 = index 1). 30 days.
  var firstDow = 1; // Sunday=0... June 1 2026 is Monday
  var cells='';
  for(var i=0;i<firstDow;i++) cells+='<div class="min-h-[92px] rounded-lg bg-surface-container-low/40"></div>';
  for(var d=1; d<=30; d++){
    var ev = CAL_EVENTS[d]||[];
    var isToday = d===9;
    var evHtml = ev.map(function(e){
      var c={primary:'bg-primary-fixed text-on-primary-fixed-variant',warn:'bg-[#FEF3C7] text-[#92400E]',error:'bg-[#FEE2E2] text-[#991B1B]'}[e.c];
      return '<div class="'+c+' rounded px-1.5 py-0.5 text-[10px] font-medium truncate mt-1">'+esc(e.t)+'</div>';
    }).join('');
    cells+='<div class="min-h-[92px] rounded-lg border border-outline-variant p-1.5 '+(isToday?'bg-primary-fixed/40 ring-2 ring-primary':'bg-surface-container-lowest')+' hover:shadow-sm transition">'+
      '<div class="text-xs font-bold '+(isToday?'text-primary':'text-on-surface-variant')+'">'+d+'</div>'+evHtml+'</div>';
  }
  return '<div class="view"><div class="flex items-center justify-between mb-6"><div><h2 class="text-2xl font-bold">יומן</h2><p class="text-on-surface-variant text-sm mt-1">יוני 2026 · דיונים, פגישות ומועדים</p></div>'+
    '<div class="flex items-center gap-2"><button class="p-2 rounded-lg hover:bg-surface-container-low">'+icon('chevron_right')+'</button><span class="font-semibold px-2">יוני 2026</span><button class="p-2 rounded-lg hover:bg-surface-container-low">'+icon('chevron_left')+'</button></div></div>'+
    card('<div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-bold text-on-surface-variant">'+dows.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div><div class="grid grid-cols-7 gap-2">'+cells+'</div>')+'</div>';
};

V.automations = function(){
  var rows = AUTOMATIONS.map(function(a,i){
    return '<div class="lift bg-surface-container-lowest rounded-2xl border border-outline-variant p-5">'+
      '<div class="flex items-start justify-between gap-4"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-lg '+(a.on?'bg-primary-fixed text-on-primary-fixed':'bg-surface-container-high text-on-surface-variant')+' flex items-center justify-center flex-shrink-0">'+icon('bolt')+'</div>'+
      '<div><h3 class="font-bold text-on-surface">'+esc(a.t)+'</h3><p class="text-sm text-on-surface-variant mt-1 leading-relaxed max-w-md">'+esc(a.d)+'</p></div></div>'+
      '<div onclick="toggleAuto('+i+')" class="sw '+(a.on?'on':'')+' cursor-pointer mt-1"></div></div>'+
      '<div class="flex items-center gap-4 mt-4 pt-3 border-t border-outline-variant text-xs text-on-surface-variant"><span class="flex items-center gap-1">'+icon('schedule','text-[14px]')+' רץ לאחרונה: '+esc(a.last)+'</span><span class="flex items-center gap-1">'+icon('trending_up','text-[14px]')+' '+esc(a.runs)+'</span>'+(a.on?'<span class="flex items-center gap-1 text-[#059669] font-medium mr-auto">'+icon('check_circle','text-[14px]')+' פעיל</span>':'<span class="mr-auto text-on-surface-variant">כבוי</span>')+'</div></div>';
  }).join('');
  return '<div class="view"><div class="flex items-center justify-between mb-6"><div><h2 class="text-2xl font-bold">אוטומציות</h2><p class="text-on-surface-variant text-sm mt-1">התהליכים שעובדים בשבילך מאחורי הקלעים — 24/7</p></div></div>'+
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 stagger">'+rows+'</div></div>';
};

/* ============================ ROUTER & INTERACTIONS ============================ */
var current = 'dashboard';
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(function(n){
    return '<a onclick="go(\''+n.id+'\')" class="nav-item relative flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer '+(n.id===current?'active':'text-on-surface-variant hover:bg-surface-container-low')+'" data-id="'+n.id+'">'+
      '<span class="nav-ind absolute right-0 top-2 bottom-2 w-1 rounded-full bg-primary"></span>'+
      '<span class="material-symbols-outlined'+(n.id===current?' filled':'')+'">'+n.icon+'</span><span class="text-sm">'+n.label+'</span></a>';
  }).join('');
}
function go(id){
  current = id;
  renderNav();
  var titles = { dashboard:['בוקר טוב, דניאל 👋',TODAY], pipeline:['צנרת לידים','ניהול פניות ותהליכי מכירה'], leads:['פניות','כל הפניות הנכנסות'], clients:['לקוחות','ניהול לקוחות המשרד'], cases:['תיקים','תיקים פעילים וסגורים'], tasks:['משימות','מטלות ומועדים'], docs:['מסמכים','כל מסמכי המשרד'], calendar:['יומן','דיונים ופגישות'], automations:['אוטומציות','התהליכים האוטומטיים'] };
  document.getElementById('hdrTitle').textContent = titles[id][0];
  document.getElementById('hdrSub').textContent = titles[id][1];
  var el = document.getElementById('view');
  el.innerHTML = '<div class="view">'+V[id]()+'</div>';
  var s = document.getElementById('search'); if(s) s.value='';
  if(id==='dashboard') requestAnimationFrame(animateDashboard);
  if(id==='pipeline') wireKanban();
  el.scrollTop = 0;
}
function animateDashboard(){
  document.querySelectorAll('.count').forEach(function(node){
    var to = +node.getAttribute('data-to'), money = node.getAttribute('data-money')==='1', pre = node.getAttribute('data-pre')||'';
    var start = performance.now(), dur = 1100;
    function step(now){
      var p = Math.min(1, (now-start)/dur), e = 1-Math.pow(1-p,3), val = Math.round(to*e);
      node.textContent = pre + (money ? val.toLocaleString('en-US') : val);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  requestAnimationFrame(function(){
    document.querySelectorAll('.bar-fill').forEach(function(b){ b.style.width = b.getAttribute('data-w')+'%'; });
  });
}
/* Kanban drag & drop */
function wireKanban(){
  var dragged=null;
  document.querySelectorAll('.kcard').forEach(function(c){
    c.addEventListener('dragstart', function(){ dragged=c; c.classList.add('dragging'); });
    c.addEventListener('dragend', function(){ c.classList.remove('dragging'); dragged=null; document.querySelectorAll('.kcol').forEach(function(k){k.classList.remove('drop-on');}); });
  });
  document.querySelectorAll('.kcol').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drop-on'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drop-on'); });
    col.addEventListener('drop', function(e){
      e.preventDefault(); col.classList.remove('drop-on');
      if(!dragged) return;
      var name = dragged.getAttribute('data-name'), stage = col.getAttribute('data-stage');
      var lead = LEADS.find(function(l){return l.name===name;});
      if(lead){ lead.stage = stage; lead.days = 0; }
      go('pipeline');
    });
  });
}
function toggleTask(i){ TASKS[i].done = !TASKS[i].done; go('tasks'); }
function toggleAuto(i){ AUTOMATIONS[i].on = !AUTOMATIONS[i].on; go('automations'); }
function filterDocs(cat, btn){
  document.querySelectorAll('.docCat').forEach(function(b){ b.className = b.className.replace('bg-primary text-white','text-on-surface-variant hover:bg-surface-container-low'); var pill=b.querySelector('span:last-child'); if(pill){pill.className=pill.className.replace('bg-white/20','bg-surface-container-high text-on-surface-variant');} });
  btn.className = btn.className.replace('text-on-surface-variant hover:bg-surface-container-low','bg-primary text-white');
  var pill=btn.querySelector('span:last-child'); if(pill){pill.className=pill.className.replace('bg-surface-container-high text-on-surface-variant','bg-white/20');}
  document.getElementById('docBody').innerHTML = docRows(cat);
}
/* Live search filters the current list view */
document.getElementById('search').addEventListener('input', function(e){
  var q = e.target.value.trim();
  var body = document.getElementById('searchBody');
  if(!body){ return; }
  body.querySelectorAll('.searchable').forEach(function(row){
    var hay = (row.getAttribute('data-s')||'').toLowerCase();
    row.hidden = q && hay.indexOf(q.toLowerCase())===-1;
  });
});

/* Boot */
renderNav();
go('dashboard');
</script>
</body>
